# Push to main deploys Cloud Run service acashi-web.
# Org policy blocks allUsers — never pass --allow-unauthenticated.
# Public access uses invoker IAM disabled (--no-invoker-iam-check).
#
# One-time: Workload Identity Federation from this repo to a deploy SA, then
# repository variables GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT.
# See README.md.
name: Deploy acashi-web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-acashi-web
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: devo-holding
  REGION: us-west1
  SERVICE: acashi-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Workload Identity config
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SA: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SA" ]; then
            echo "Set repository variables GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT."
            echo "See README.md (Deploy)."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --source . \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --no-invoker-iam-check \
            --update-env-vars=GCP_PROJECT=devo-holding,GOOGLE_CLOUD_PROJECT=devo-holding
